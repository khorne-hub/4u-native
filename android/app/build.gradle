plugins {
    id 'com.android.application'
}

// The .so files come already built (the build script copies them into jniLibs): Gradle only packs them.
// (the signing key: ../keystore.properties and ../mh4u.keystore, never in git; without them the APK can't be signed)
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "com.mh4u.port"
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.mh4u.native"
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        local {
            storeFile file('../mh4u.keystore')
            storePassword signing['storePassword']
            keyAlias signing['keyAlias']
            keyPassword signing['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
        debug {
            if (signingFile.exists()) signingConfig signingConfigs.local
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // The public APK carries no game code: every player builds their own on a PC.
            excludes += ['**/libmh4u_code*.so']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
